name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version comes from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm -r test

      # The committed canonical bundles must be reproducible from a clean checkout: same output hash per assumption set.
      - run: node apps/cli/dist/index.js bundles --dir "$RUNNER_TEMP/bundles"
      - run: |
          node -e '
            const fs = require("fs");
            const version = require("./package.json").version;
            const committed = JSON.parse(fs.readFileSync(`bundles/${version}/index.json`, "utf8"));
            const fresh = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/bundles/index.json", "utf8"));
            let failed = false;
            for (const bundle of committed.bundles) {
              const match = fresh.bundles.find((candidate) => candidate.set === bundle.set);
              const ok = match && match.outputHash === bundle.outputHash && match.setHash === bundle.setHash;
              console.log(`${bundle.set}: committed ${bundle.outputHash}, fresh ${match?.outputHash} ${ok ? "ok" : "MISMATCH"}`);
              if (!ok) failed = true;
            }
            if (JSON.stringify(committed.fixtureHashes) !== JSON.stringify(fresh.fixtureHashes)) { console.log("fixture hashes differ"); failed = true; }
            process.exit(failed ? 1 : 0);
          '
